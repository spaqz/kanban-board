<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Канбано</title>
    <link rel="stylesheet" href="body.css">
    <link rel="stylesheet" href="text.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="auth-body">

    <div class="auth-card">
        <div class="auth-header">
            <h2>Вход в аккаунт</h2>
            <p>Введите свои данные для входа в Канбано</p>
        </div>

        <form class="auth-form">
            <!-- 👇 ЗАМЕНИЛИ ЛОГИН НА EMAIL -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Введите ваш email" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Введите ваш пароль" required>
                    <span class="toggle-password" onclick="togglePassword('password', this)">👁️</span>
                </div>
            </div>

            <button type="submit" class="btn-submit">Войти</button>
        </form>

        <div class="divider">или</div>

        <a href="board.html" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 18 18">
                <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.82 2.71v2.28h2.95c1.73-1.59 2.73-3.93 2.73-6.64z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.95-2.28c-.81.54-1.85.86-3.01.86-2.32 0-4.28-1.57-4.99-3.69H1.01v2.35C2.5 15.96 5.5 18 9 18z"/>
                <path fill="#FBBC05" d="M4.01 10.71c-.19-.54-.3-1.12-.3-1.71s.11-1.17.3-1.71V4.94H1.01C.37 6.22 0 7.68 0 9.2s.37 2.98 1.01 4.26l3-2.35z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.34l2.58-2.58C13.46.89 11.43 0 9 0 5.5 0 2.5 2.04 1.01 4.94l3 2.35c.71-2.12 2.67-3.71 4.99-3.71z"/>
            </svg>
            Войти через Google
        </a>

        <div class="auth-switch">
            <span>Еще нет аккаунта?</span>
            <a href="index-login.html" class="switch-link">Зарегистрироваться</a>
        </div>
    </div>

    <script>
        function togglePassword(inputId, iconElement) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconElement.textContent = '🙈';
            } else {
                input.type = 'password';
                iconElement.textContent = '👁️';
            }
        }
    </script>

    <script src="api.js"></script>
    <script src="auth.js"></script>
</body>
</html>
